apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
  namespace: bookstore
  labels:
    app: customer-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: customer-service
  template:
    metadata:
      labels:
        app: customer-service
    spec:
      containers:
        - name: customer-service
          image: ghcr.io/OWNER/bookstore-customer:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: bookstore-config
            - secretRef:
                name: bookstore-secrets
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: customer-db-secret
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: customer-service
  namespace: bookstore
spec:
  selector:
    app: customer-service
  ports:
    - port: 80
      targetPort: 8000
