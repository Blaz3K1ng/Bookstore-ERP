# Shared Secrets — fill in real values before applying.
# Generate with: kubectl create secret generic bookstore-secrets -n bookstore \
#   --from-literal=JWT_SECRET=$(openssl rand -hex 32) \
#   --from-literal=INTERNAL_SERVICE_TOKEN=$(openssl rand -hex 24) \
#   --from-literal=RABBITMQ_USER=bookstore \
#   --from-literal=RABBITMQ_PASSWORD=$(openssl rand -hex 16)
apiVersion: v1
kind: Secret
metadata:
  name: bookstore-secrets
  namespace: bookstore
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_WITH_STRONG_SECRET"
  INTERNAL_SERVICE_TOKEN: "REPLACE_WITH_STRONG_TOKEN"
  RABBITMQ_USER: "bookstore"
  RABBITMQ_PASSWORD: "REPLACE_WITH_STRONG_PASSWORD"
