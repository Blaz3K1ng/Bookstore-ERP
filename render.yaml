# Render Deployment Blueprint — PageCraft Bookstore ERP
#
# DATABASE SETUP (free, no card required):
#   1. Go to https://neon.tech and sign in with GitHub (free, no card needed).
#   2. Create ONE project — Neon gives you multiple databases inside one project.
#   3. Create 6 databases inside that project:
#      auth_db, inventory_db, orders_db, customers_db, finance_db, supplier_db
#   4. For each database, copy its connection string (starts with postgres://...)
#   5. Paste each connection string into the matching DATABASE_URL below.
#
# RABBITMQ (for order events):
#   1. Go to https://cloudamqp.com → free "Little Lemur" plan, no card needed.
#   2. Copy RABBITMQ_HOST, RABBITMQ_USER, RABBITMQ_PASSWORD from instance details.
#
# DEPLOY ORDER:
#   1. Push this file, connect repo in Render → "New Blueprint Instance".
#   2. Fill in all sync: false values before deploying (especially DATABASE_URL).
#   3. After all services are live, fill in the *_SERVICE_URL env vars and redeploy.
#   4. Use the SAME JWT_SECRET and INTERNAL_SERVICE_TOKEN across all services.

services:
  # ── Auth Service ────────────────────────────────────────────────────────────
  - type: web
    name: bookstore-auth
    runtime: docker
    dockerfilePath: ./auth-service/Dockerfile
    dockerContext: ./auth-service
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        sync: false  # Neon connection string for auth_db
      - key: JWT_SECRET
        sync: false  # Generate: openssl rand -hex 32
      - key: SEED_DATABASE
        value: "true"

  # ── Inventory Service ────────────────────────────────────────────────────────
  - type: web
    name: bookstore-inventory
    runtime: docker
    dockerfilePath: ./inventory-service/Dockerfile
    dockerContext: ./inventory-service
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        sync: false  # Neon connection string for inventory_db
      - key: AUTH_SERVICE_URL
        sync: false  # https://bookstore-auth.onrender.com
      - key: INTERNAL_SERVICE_TOKEN
        sync: false  # Same value across all services
      - key: SEED_DATABASE
        value: "true"

  # ── Customer Service ─────────────────────────────────────────────────────────
  - type: web
    name: bookstore-customer
    runtime: docker
    dockerfilePath: ./customer-service/Dockerfile
    dockerContext: ./customer-service
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        sync: false  # Neon connection string for customers_db
      - key: AUTH_SERVICE_URL
        sync: false
      - key: INTERNAL_SERVICE_TOKEN
        sync: false
      - key: SEED_DATABASE
        value: "true"

  # ── Order Service ────────────────────────────────────────────────────────────
  - type: web
    name: bookstore-order
    runtime: docker
    dockerfilePath: ./order-service/Dockerfile
    dockerContext: ./order-service
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        sync: false  # Neon connection string for orders_db
      - key: AUTH_SERVICE_URL
        sync: false
      - key: INVENTORY_SERVICE_URL
        sync: false
      - key: CUSTOMER_SERVICE_URL
        sync: false
      - key: INTERNAL_SERVICE_TOKEN
        sync: false
      - key: RABBITMQ_HOST
        sync: false  # From CloudAMQP
      - key: RABBITMQ_PORT
        value: "5672"
      - key: RABBITMQ_USER
        sync: false
      - key: RABBITMQ_PASSWORD
        sync: false
      - key: RABBITMQ_QUEUE
        value: order.created
      - key: NOTIFICATION_QUEUE
        value: order.notifications

  # ── Finance Service ──────────────────────────────────────────────────────────
  - type: web
    name: bookstore-finance
    runtime: docker
    dockerfilePath: ./finance-service/Dockerfile
    dockerContext: ./finance-service
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        sync: false  # Neon connection string for finance_db
      - key: AUTH_SERVICE_URL
        sync: false
      - key: INTERNAL_SERVICE_TOKEN
        sync: false
      - key: RABBITMQ_HOST
        sync: false
      - key: RABBITMQ_PORT
        value: "5672"
      - key: RABBITMQ_USER
        sync: false
      - key: RABBITMQ_PASSWORD
        sync: false
      - key: RABBITMQ_QUEUE
        value: order.created

  # ── Supplier Service ─────────────────────────────────────────────────────────
  - type: web
    name: bookstore-supplier
    runtime: docker
    dockerfilePath: ./supplier-service/Dockerfile
    dockerContext: ./supplier-service
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        sync: false  # Neon connection string for supplier_db
      - key: AUTH_SERVICE_URL
        sync: false
      - key: INVENTORY_SERVICE_URL
        sync: false
      - key: INTERNAL_SERVICE_TOKEN
        sync: false
      - key: SEED_DATABASE
        value: "true"

  # ── Reporting Service ────────────────────────────────────────────────────────
  - type: web
    name: bookstore-reporting
    runtime: docker
    dockerfilePath: ./reporting-service/Dockerfile
    dockerContext: ./reporting-service
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_KEY
        generateValue: true
      - key: AUTH_SERVICE_URL
        sync: false
      - key: FINANCE_SERVICE_URL
        sync: false
      - key: INVENTORY_SERVICE_URL
        sync: false
      - key: ORDER_SERVICE_URL
        sync: false
      - key: INTERNAL_SERVICE_TOKEN
        sync: false

  # ── API Gateway ──────────────────────────────────────────────────────────────
  - type: web
    name: bookstore-api-gateway
    runtime: docker
    dockerfilePath: ./api-gateway/Dockerfile
    dockerContext: ./api-gateway
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_KEY
        generateValue: true
      - key: AUTH_SERVICE_URL
        sync: false
      - key: INVENTORY_SERVICE_URL
        sync: false
      - key: ORDER_SERVICE_URL
        sync: false
      - key: CUSTOMER_SERVICE_URL
        sync: false
      - key: FINANCE_SERVICE_URL
        sync: false
      - key: SUPPLIER_SERVICE_URL
        sync: false
      - key: REPORTING_SERVICE_URL
        sync: false

  # ── Frontend ─────────────────────────────────────────────────────────────────
  - type: web
    name: bookstore-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: API_GATEWAY_URL
        sync: false  # https://bookstore-api-gateway.onrender.com

