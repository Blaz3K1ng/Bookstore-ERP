version: '3.8'

services:

  # ─── API Gateway (port 8000) ─────────────────────────────────────
  api-gateway:
    build: ./api-gateway
    ports:
      - "8000:8000"
    environment:
      AUTH_SERVICE_URL:      http://auth-service:8000
      INVENTORY_SERVICE_URL: http://inventory-service:8000
      ORDER_SERVICE_URL:     http://order-service:8000
      CUSTOMER_SERVICE_URL:  http://customer-service:8000
      FINANCE_SERVICE_URL:   http://finance-service:8000
      APP_KEY: base64:REPLACE_WITH_GATEWAY_KEY
    depends_on:
      - auth-service
      - inventory-service
      - order-service
      - customer-service
      - finance-service
    networks:
      - bookstore-net
    restart: unless-stopped

  # ─── Auth Service ────────────────────────────────────────────────
  auth-service:
    build: ./auth-service
    environment:
      APP_KEY:      base64:REPLACE_WITH_AUTH_KEY
      DB_HOST:      mysql-auth
      DB_PORT:      3306
      DB_DATABASE:  auth_db
      DB_USERNAME:  bookstore
      DB_PASSWORD:  secret
      JWT_SECRET:   REPLACE_WITH_STRONG_JWT_SECRET_64CHARS
    depends_on:
      mysql-auth:
        condition: service_healthy
    networks:
      - bookstore-net
    restart: unless-stopped

  mysql-auth:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE:      auth_db
      MYSQL_USER:          bookstore
      MYSQL_PASSWORD:      secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - mysql_auth_data:/var/lib/mysql
    networks:
      - bookstore-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  # ─── Inventory Service ───────────────────────────────────────────
  inventory-service:
    build: ./inventory-service
    environment:
      APP_KEY:          base64:REPLACE_WITH_INVENTORY_KEY
      DB_HOST:          mysql-inventory
      DB_DATABASE:      inventory_db
      DB_USERNAME:      bookstore
      DB_PASSWORD:      secret
      AUTH_SERVICE_URL: http://auth-service:8000
    depends_on:
      mysql-inventory:
        condition: service_healthy
    networks:
      - bookstore-net
    restart: unless-stopped

  mysql-inventory:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE:      inventory_db
      MYSQL_USER:          bookstore
      MYSQL_PASSWORD:      secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - mysql_inventory_data:/var/lib/mysql
    networks:
      - bookstore-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  # ─── Order Service ───────────────────────────────────────────────
  order-service:
    build: ./order-service
    environment:
      APP_KEY:              base64:REPLACE_WITH_ORDER_KEY
      DB_HOST:              mysql-orders
      DB_DATABASE:          orders_db
      DB_USERNAME:          bookstore
      DB_PASSWORD:          secret
      AUTH_SERVICE_URL:     http://auth-service:8000
      INVENTORY_SERVICE_URL: http://inventory-service:8000
      RABBITMQ_HOST:        rabbitmq
      RABBITMQ_PORT:        5672
      RABBITMQ_USER:        guest
      RABBITMQ_PASSWORD:    guest
      RABBITMQ_QUEUE:       order.created
    depends_on:
      mysql-orders:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - bookstore-net
    restart: unless-stopped

  # Worker: consumes failed queue jobs
  order-worker:
    build: ./order-service
    command: php artisan queue:work --sleep=3 --tries=3
    environment:
      DB_HOST:     mysql-orders
      DB_DATABASE: orders_db
      DB_USERNAME: bookstore
      DB_PASSWORD: secret
    depends_on:
      - mysql-orders
    networks:
      - bookstore-net
    restart: unless-stopped

  mysql-orders:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE:      orders_db
      MYSQL_USER:          bookstore
      MYSQL_PASSWORD:      secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - mysql_orders_data:/var/lib/mysql
    networks:
      - bookstore-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  # ─── Customer Service ────────────────────────────────────────────
  customer-service:
    build: ./customer-service
    environment:
      APP_KEY:          base64:REPLACE_WITH_CUSTOMER_KEY
      DB_HOST:          mysql-customers
      DB_DATABASE:      customers_db
      DB_USERNAME:      bookstore
      DB_PASSWORD:      secret
      AUTH_SERVICE_URL: http://auth-service:8000
    depends_on:
      mysql-customers:
        condition: service_healthy
    networks:
      - bookstore-net
    restart: unless-stopped

  mysql-customers:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE:      customers_db
      MYSQL_USER:          bookstore
      MYSQL_PASSWORD:      secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - mysql_customers_data:/var/lib/mysql
    networks:
      - bookstore-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  # ─── Finance Service ─────────────────────────────────────────────
  finance-service:
    build: ./finance-service
    environment:
      APP_KEY:          base64:REPLACE_WITH_FINANCE_KEY
      DB_HOST:          mysql-finance
      DB_DATABASE:      finance_db
      DB_USERNAME:      bookstore
      DB_PASSWORD:      secret
      AUTH_SERVICE_URL: http://auth-service:8000
      RABBITMQ_HOST:    rabbitmq
      RABBITMQ_PORT:    5672
      RABBITMQ_USER:    guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_QUEUE:   order.created
    depends_on:
      mysql-finance:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - bookstore-net
    restart: unless-stopped

  # Finance RabbitMQ Consumer
  finance-consumer:
    build: ./finance-service
    command: php artisan consume:orders
    environment:
      DB_HOST:           mysql-finance
      DB_DATABASE:       finance_db
      DB_USERNAME:       bookstore
      DB_PASSWORD:       secret
      RABBITMQ_HOST:     rabbitmq
      RABBITMQ_PORT:     5672
      RABBITMQ_USER:     guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_QUEUE:    order.created
    depends_on:
      - mysql-finance
      - rabbitmq
    networks:
      - bookstore-net
    restart: unless-stopped

  mysql-finance:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE:      finance_db
      MYSQL_USER:          bookstore
      MYSQL_PASSWORD:      secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - mysql_finance_data:/var/lib/mysql
    networks:
      - bookstore-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  # ─── RabbitMQ (Message Broker) ───────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI: http://localhost:15672 (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - bookstore-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      retries: 5

# ─── Shared Network ──────────────────────────────────────────────
networks:
  bookstore-net:
    driver: bridge

# ─── Volumes ─────────────────────────────────────────────────────
volumes:
  mysql_auth_data:
  mysql_inventory_data:
  mysql_orders_data:
  mysql_customers_data:
  mysql_finance_data:
  rabbitmq_data:
