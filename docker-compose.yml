version: '3.8'

services:

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8000"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8000
      INVENTORY_SERVICE_URL: http://inventory-service:8000
      ORDER_SERVICE_URL: http://order-service:8000
      CUSTOMER_SERVICE_URL: http://customer-service:8000
      FINANCE_SERVICE_URL: http://finance-service:8000
      SUPPLIER_SERVICE_URL: http://supplier-service:8000
      REPORTING_SERVICE_URL: http://reporting-service:8000
      APP_KEY: base64:YWRtaW5nYXRld2F5a2V5Zm9yZGV2ZWxvcG1lbnQ=
    depends_on:
      - auth-service
      - inventory-service
      - order-service
      - customer-service
      - finance-service
      - supplier-service
      - reporting-service
    networks:
      - bookstore-net
    restart: unless-stopped

  auth-service:
    build: ./auth-service
    environment:
      APP_KEY: base64:YXV0aHNlcnZpY2VrZXlmb3JkZXZlbG9wbWVudG9vbHM=
      DB_HOST: mysql-auth
      DB_PORT: 3306
      DB_DATABASE: auth_db
      DB_USERNAME: bookstore
      DB_PASSWORD: secret
      JWT_SECRET: pagecraft-jwt-secret-change-in-production-64chars!!
      SEED_DATABASE: "true"
    depends_on:
      mysql-auth:
        condition: service_healthy
    networks:
      - bookstore-net
    restart: unless-stopped

  mysql-auth:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: auth_db
      MYSQL_USER: bookstore
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - mysql_auth_data:/var/lib/mysql
    networks:
      - bookstore-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  inventory-service:
    build: ./inventory-service
    environment:
      APP_KEY: base64:aW52ZW50b3J5c2VydmljZWtleWZvcmRldmVsb3BtZW50
      DB_HOST: mysql-inventory
      DB_DATABASE: inventory_db
      DB_USERNAME: bookstore
      DB_PASSWORD: secret
      AUTH_SERVICE_URL: http://auth-service:8000
      INTERNAL_SERVICE_TOKEN: pagecraft-internal-dev-token
      SEED_DATABASE: "true"
    depends_on:
      mysql-inventory:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - bookstore-net
    restart: unless-stopped

  mysql-inventory:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: inventory_db
      MYSQL_USER: bookstore
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - mysql_inventory_data:/var/lib/mysql
    networks:
      - bookstore-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  order-service:
    build: ./order-service
    environment:
      APP_KEY: base64:b3JkZXJzZXJ2aWNla2V5Zm9yZGV2ZWxvcG1lbnRvb2xz
      DB_HOST: mysql-orders
      DB_DATABASE: orders_db
      DB_USERNAME: bookstore
      DB_PASSWORD: secret
      AUTH_SERVICE_URL: http://auth-service:8000
      INVENTORY_SERVICE_URL: http://inventory-service:8000
      CUSTOMER_SERVICE_URL: http://customer-service:8000
      INTERNAL_SERVICE_TOKEN: pagecraft-internal-dev-token
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_QUEUE: order.created
      NOTIFICATION_QUEUE: order.notifications
    depends_on:
      mysql-orders:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      inventory-service:
        condition: service_started
      customer-service:
        condition: service_started
    networks:
      - bookstore-net
    restart: unless-stopped

  mysql-orders:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: orders_db
      MYSQL_USER: bookstore
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - mysql_orders_data:/var/lib/mysql
    networks:
      - bookstore-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  customer-service:
    build: ./customer-service
    environment:
      APP_KEY: base64:Y3VzdG9tZXJzZXJ2aWNla2V5Zm9yZGV2ZWxvcG1lbnQ=
      DB_HOST: mysql-customers
      DB_DATABASE: customers_db
      DB_USERNAME: bookstore
      DB_PASSWORD: secret
      AUTH_SERVICE_URL: http://auth-service:8000
      INTERNAL_SERVICE_TOKEN: pagecraft-internal-dev-token
      SEED_DATABASE: "true"
    depends_on:
      mysql-customers:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - bookstore-net
    restart: unless-stopped

  mysql-customers:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: customers_db
      MYSQL_USER: bookstore
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - mysql_customers_data:/var/lib/mysql
    networks:
      - bookstore-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  finance-service:
    build: ./finance-service
    environment:
      APP_KEY: base64:ZmluYW5jZXNlcnZpY2VrZXlmb3JkZXZlbG9wbWVudG9vbHM=
      DB_HOST: mysql-finance
      DB_DATABASE: finance_db
      DB_USERNAME: bookstore
      DB_PASSWORD: secret
      AUTH_SERVICE_URL: http://auth-service:8000
      INTERNAL_SERVICE_TOKEN: pagecraft-internal-dev-token
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_QUEUE: order.created
    depends_on:
      mysql-finance:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - bookstore-net
    restart: unless-stopped

  finance-consumer:
    build: ./finance-service
    command: php artisan consume:orders
    environment:
      APP_KEY: base64:ZmluYW5jZXNlcnZpY2VrZXlmb3JkZXZlbG9wbWVudG9vbHM=
      DB_HOST: mysql-finance
      DB_DATABASE: finance_db
      DB_USERNAME: bookstore
      DB_PASSWORD: secret
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_QUEUE: order.created
    depends_on:
      - mysql-finance
      - rabbitmq
      - finance-service
    networks:
      - bookstore-net
    restart: unless-stopped

  mysql-finance:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: finance_db
      MYSQL_USER: bookstore
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - mysql_finance_data:/var/lib/mysql
    networks:
      - bookstore-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - bookstore-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      retries: 5

  supplier-service:
    build: ./supplier-service
    environment:
      APP_KEY: base64:c3VwcGxpZXJzZXJ2aWNla2V5Zm9yZGV2ZWxvcA==
      DB_HOST: mysql-supplier
      DB_DATABASE: supplier_db
      DB_USERNAME: bookstore
      DB_PASSWORD: secret
      AUTH_SERVICE_URL: http://auth-service:8000
      INVENTORY_SERVICE_URL: http://inventory-service:8000
      INTERNAL_SERVICE_TOKEN: pagecraft-internal-dev-token
      SEED_DATABASE: "true"
    depends_on:
      mysql-supplier:
        condition: service_healthy
      auth-service:
        condition: service_started
      inventory-service:
        condition: service_started
    networks:
      - bookstore-net
    restart: unless-stopped

  mysql-supplier:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: supplier_db
      MYSQL_USER: bookstore
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - mysql_supplier_data:/var/lib/mysql
    networks:
      - bookstore-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  reporting-service:
    build: ./reporting-service
    environment:
      APP_KEY: base64:cmVwb3J0aW5nc2VydmljZWtleWZvcmRldmVsb3A=
      AUTH_SERVICE_URL: http://auth-service:8000
      FINANCE_SERVICE_URL: http://finance-service:8000
      INVENTORY_SERVICE_URL: http://inventory-service:8000
      ORDER_SERVICE_URL: http://order-service:8000
      INTERNAL_SERVICE_TOKEN: pagecraft-internal-dev-token
    depends_on:
      - auth-service
      - finance-service
      - inventory-service
      - order-service
    networks:
      - bookstore-net
    restart: unless-stopped

  notification-service:
    build: ./notification-service
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      NOTIFICATION_QUEUE: order.notifications
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - bookstore-net
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    environment:
      API_GATEWAY_URL: http://api-gateway:8000
    depends_on:
      - api-gateway
    networks:
      - bookstore-net
    restart: unless-stopped

networks:
  bookstore-net:
    driver: bridge

volumes:
  mysql_auth_data:
  mysql_inventory_data:
  mysql_orders_data:
  mysql_customers_data:
  mysql_finance_data:
  mysql_supplier_data:
  rabbitmq_data:
